<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto News Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg: #0b0e14; --panel: #141925; --border: #232a3a;
      --text: #e6e9f0; --muted: #8b94a7;
      --bull: #2ecc71; --bear: #e74c3c; --neutral: #7f8ea3; --accent: #f7a600;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg); color: var(--text); }
    /* Фоновое изображение на весь экран с затемнением (чтобы текст читался).
       Картинку положить в frontend/assets/crypto-bg.jpg — фон включится сам.
       Если файла нет, остаётся базовый тёмный фон (ничего не ломается). */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background:
        linear-gradient(rgba(11,14,20,0.88), rgba(11,14,20,0.94)),
        url('/static/assets/crypto-bg.jpg') center center / cover no-repeat;
      background-attachment: fixed;
    }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: rgba(11,14,20,0.55); backdrop-filter: blur(6px);
      position: sticky; top: 0; z-index: 10; }
    h1 { font-size: 18px; margin: 0; }
    .badge-ai { font-size: 12px; color: var(--muted); }
    .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button, input { background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: #1a1200; border: none; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    main { padding: 20px; display: grid; grid-template-columns: 1fr 360px; gap: 20px; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    .panel { background: rgba(20,25,37,0.78); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; backdrop-filter: blur(6px); }
    .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; }
    .news { display: flex; flex-direction: column; gap: 12px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px;
      flex-wrap: wrap; margin-bottom: 6px; }
    .card .title { font-weight: 600; margin-bottom: 6px; }
    .card .title a { color: var(--text); text-decoration: none; }
    .card .summary { font-size: 14px; color: #c7cdda; margin-bottom: 10px; }
    .biases { display: flex; gap: 8px; flex-wrap: wrap; }
    .bias { font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .Bullish { background: rgba(46,204,113,.15); color: var(--bull); }
    .Bearish { background: rgba(231,76,60,.15); color: var(--bear); }
    .Neutral { background: rgba(127,142,163,.15); color: var(--neutral); }
    .chip { font-size: 11px; padding: 2px 7px; border-radius: 5px;
      background: rgba(247,166,0,.12); color: var(--accent); }
    .ev { font-size: 11px; padding: 2px 7px; border-radius: 5px; text-transform: uppercase;
      letter-spacing: .03em; background: rgba(91,124,250,.15); color: #8aa0ff; }
    .indices { display: flex; gap: 10px; }
    .idx { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .idx .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .idx .val { font-size: 22px; font-weight: 700; margin: 2px 0; }
    .idx .cls { font-size: 12px; }
    .idx .bar { height: 5px; border-radius: 3px; background: var(--border); margin-top: 6px; overflow: hidden; }
    .idx .bar > span { display: block; height: 100%; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    .stat { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .muted { color: var(--muted); }
    #coinSearch { min-width: 180px; }
    .search-info { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .search-info .px { color: var(--text); font-weight: 600; }
    .search-info .up { color: var(--bull); } .search-info .down { color: var(--bear); }
    .search-info .clear { cursor: pointer; color: var(--accent); border: none; background: none; font-size: 13px; }
    .search-info .star { cursor: pointer; border: none; background: none; font-size: 14px; color: var(--accent); }
    .watchlist { display: flex; gap: 8px; align-items: center; padding: 8px 20px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); }
    .watchlist:empty { display: none; }
    .watchlist .wl-label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .wl-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
    .wl-chip:hover { border-color: var(--accent); }
    .wl-chip .x { color: var(--muted); font-size: 12px; }
    .wl-chip .x:hover { color: var(--bear); }
    .tabs { display: flex; gap: 4px; }
    .tab { background: transparent; border: 1px solid transparent; color: var(--muted);
      border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
    .tab.active { color: var(--text); background: var(--panel); border-color: var(--border); }
    #bubblesView { padding: 8px 12px 0; }
    #marketTable { max-height: calc(100vh - 130px); overflow: auto; padding: 0 4px; }
    .mtable { display: inline-table; width: auto; min-width: 720px; border-collapse: collapse; font-size: 13px; }
    .mtable th { position: sticky; top: 0; background: #0f131c; color: var(--muted);
      text-align: right; padding: 10px 9px; cursor: pointer; white-space: nowrap;
      border-bottom: 1px solid var(--border); user-select: none; }
    .mtable th:first-child, .mtable th:nth-child(2) { text-align: left; }
    .mtable td { text-align: right; padding: 9px 9px; border-bottom: 1px solid rgba(35,42,58,.5); white-space: nowrap; }
    .mtable td:first-child { color: var(--muted); }
    .mtable td.coin { text-align: left; }
    .mtable td.coin img { width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; border-radius: 50%; }
    .mtable tbody tr { cursor: pointer; }
    .mtable tbody tr:hover { background: rgba(247,166,0,.06); }
    .mtable .up { color: var(--bull); } .mtable .down { color: var(--bear); }
    .mtable td.coin .name { color: var(--muted); margin-left: 6px;
      display: inline-block; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; vertical-align: middle; }
    /* модальное окно монеты */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
    .modal-card { position: relative; width: 560px; max-width: calc(100vw - 32px); max-height: calc(100vh - 60px);
      overflow: auto; background: rgba(20,25,37,0.97); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
    .cm-head { display: flex; align-items: center; gap: 12px; }
    .cm-head img { width: 40px; height: 40px; border-radius: 50%; }
    .cm-name { font-size: 18px; font-weight: 700; }
    .cm-price { font-size: 30px; font-weight: 700; margin: 10px 0 12px; }
    .cm-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
    .cm-chip { border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px; text-align: center; }
    .cm-chip span { display: block; font-size: 11px; }
    .cm-chip b { font-size: 14px; }
    .cm-chip .up, .cm-chip b.up { color: var(--bull); } .cm-chip b.down { color: var(--bear); }
    .cm-chart-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .cm-chart-tabs button { background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
    .cm-chart-tabs button.active { background: var(--panel); color: var(--text); }
    .cm-stats { margin: 14px 0; display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
    .cm-stats .row { display: flex; justify-content: space-between; }
    .cm-stats .row span:first-child { color: var(--muted); }
    .cm-actions { display: flex; gap: 10px; align-items: center; }
    .cm-link { color: var(--accent); text-decoration: none; font-size: 14px; }
    .market { display: flex; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border);
      overflow-x: auto; background: rgba(11,14,20,0.45); backdrop-filter: blur(4px); }
    .ticker { display: flex; gap: 8px; align-items: baseline; font-size: 13px;
      background: rgba(20,25,37,0.7); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; white-space: nowrap; }
    .ticker .sym { font-weight: 700; }
    .ticker .up { color: var(--bull); } .ticker .down { color: var(--bear); }
    .cc { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .cc .row { display: flex; justify-content: space-between; }
    .cc .row span:first-child { color: var(--muted); }
    .statsbar { display: flex; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border);
      overflow-x: auto; background: rgba(11,14,20,0.3); flex-wrap: nowrap; }
    .stat-chip { display: flex; align-items: center; gap: 7px; font-size: 13px;
      background: rgba(20,25,37,0.7); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 13px; white-space: nowrap; }
    .stat-chip .ic { font-size: 15px; }
    .stat-chip .sc-lbl { color: var(--muted); font-size: 11px; }
    .stat-chip .sc-val { font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>🪙 Crypto News Analyzer</h1>
    <span class="badge-ai" id="aiBadge">…</span>
    <nav class="tabs">
      <button class="tab active" data-tab="feed">Лента</button>
      <button class="tab" data-tab="bubbles">Объём рынка</button>
    </nav>
    <div class="controls" id="feedControls">
      <input id="coinSearch" list="coinList" placeholder="Монета: BTC, Solana…" autocomplete="off" />
      <datalist id="coinList"></datalist>
      <button id="searchBtn">Поиск</button>
      <span id="searchInfo" class="search-info"></span>
      <select id="eventFilter">
        <option value="">Все события</option>
        <option value="upgrade">Апгрейды</option>
        <option value="collaboration">Коллаборации</option>
        <option value="announcement">Анонсы</option>
        <option value="listing">Листинги</option>
        <option value="regulation">Регуляторика</option>
        <option value="market">Рынок</option>
      </select>
      <select id="hours">
        <option value="1">1 час</option>
        <option value="2" selected>2 часа</option>
        <option value="6">6 часов</option>
        <option value="24">24 часа</option>
      </select>
      <button class="primary" id="collectBtn">Собрать сейчас</button>
    </div>
  </header>

  <div class="statsbar" id="statsbar">
    <div class="stat-chip"><div><div class="sc-lbl">Капитализация</div><div class="sc-val" id="sb-mcap">…</div></div></div>
    <div class="stat-chip"><div><div class="sc-lbl">Страх / Жадность</div><div class="sc-val" id="sb-fg">…</div></div></div>
    <div class="stat-chip"><div><div class="sc-lbl">Альт-сезон</div><div class="sc-val" id="sb-alt">…</div></div></div>
  </div>

  <div id="feedView">
  <div class="market" id="market"></div>
  <div class="watchlist" id="watchlist"></div>

  <main>
    <section class="panel">
      <h2>Лента событий</h2>
      <div class="news" id="news"><div class="empty">Нажми «Собрать сейчас», чтобы запустить конвейер.</div></div>
    </section>
    <aside class="panel">
      <h2>Индексы рынка</h2>
      <div class="indices" id="indices"><span class="muted">загрузка…</span></div>
      <h2 style="margin-top:18px">Капитализация и доминирование</h2>
      <div class="cc" id="globalMetrics"><span class="muted">загрузка…</span></div>
      <h2 style="margin-top:18px">Сентимент по монетам</h2>
      <canvas id="sentimentChart" height="220"></canvas>
      <div class="stat" id="collectStat"></div>
      <h2 style="margin-top:18px">Correlation Check</h2>
      <div class="cc" id="correlation"><span class="muted">собери данные →</span></div>
    </aside>
  </main>
  </div>

  <section id="bubblesView" style="display:none">
    <div id="marketTable"></div>
  </section>

  <div id="coinModal" class="modal" style="display:none">
    <div class="modal-card">
      <button class="modal-close" id="coinModalClose">✕</button>
      <div class="cm-head">
        <img id="cmLogo" alt=""/>
        <div>
          <div class="cm-name"><span id="cmName"></span> <span class="muted" id="cmSym"></span></div>
          <div class="muted" id="cmRank"></div>
        </div>
      </div>
      <div class="cm-price" id="cmPrice"></div>
      <div class="cm-chips" id="cmChips"></div>
      <div class="cm-chart-tabs" id="cmChartTabs">
        <button data-d="1" class="active">1Д</button>
        <button data-d="7">7Д</button>
        <button data-d="30">30Д</button>
        <button data-d="365">1Г</button>
      </div>
      <canvas id="cmChart" height="170"></canvas>
      <div class="cm-stats" id="cmStats"></div>
      <div class="cm-actions">
        <button class="primary" id="cmNews">Новости по монете</button>
        <a id="cmLink" class="cm-link" target="_blank" rel="noopener">CoinGecko ↗</a>
      </div>
    </div>
  </div>

  <script>
    const API = location.origin;
    let chart;
    let lastItems = [];
    let currentCoin = '';   // активный фильтр по монете (символ) — задаётся поиском
    const EV_LABEL = { upgrade:'Апгрейд', collaboration:'Коллаб', announcement:'Анонс',
      listing:'Листинг', regulation:'Регуляторика', market:'Рынок', other:'Прочее' };

    async function loadHealth() {
      try {
        const h = await (await fetch(`${API}/api/health`)).json();
        document.getElementById('aiBadge').textContent =
          h.ai_enabled ? 'Роман Субота' : 'Роман Субота (демо-режим)';
      } catch { document.getElementById('aiBadge').textContent = 'API offline'; }
    }

    function biasHtml(db) {
      return ['BTC','ETH','SOL'].map(c =>
        `<span class="bias ${db[c]}">${c}: ${db[c]}</span>`).join('');
    }

    function renderFeed(items) {
      const el = document.getElementById('news');
      if (!items.length) {
        const msg = currentCoin
          ? `Нет новостей по ${currentCoin} в собранных данных.<br>Нажми «Собрать сейчас» или выбери период побольше — котировка монеты показана выше.`
          : 'Нет событий. Нажми «Собрать сейчас», чтобы запустить конвейер.';
        el.innerHTML = `<div class="empty">${msg}</div>`;
        return;
      }
      el.innerHTML = items.map(a => {
        const it = a.item, an = a.analysis;
        const time = new Date(it.published_at).toLocaleString('ru-RU');
        const coins = it.coins.map(c => `<span class="chip">${c}</span>`).join(' ');
        const title = it.url ? `<a href="${it.url}" target="_blank">${it.title}</a>` : it.title;
        const ev = `<span class="ev">${EV_LABEL[an.event_type] || an.event_type || 'other'}</span>`;
        return `<div class="card">
          <div class="meta"><span>${it.source}</span><span>${time}</span>${ev}
            <span>сентимент: ${an.sentiment >= 0 ? '+' : ''}${an.sentiment}</span>${coins}</div>
          <div class="title">${title}</div>
          <div class="summary">${an.ai_analysis || an.summary}</div>
          <div class="biases">${biasHtml(an.directional_bias)}</div>
        </div>`;
      }).join('');
    }

    function renderChart(map) {
      const labels = Object.keys(map), data = Object.values(map);
      const colors = data.map(v => v > 0.1 ? '#2ecc71' : v < -0.1 ? '#e74c3c' : '#7f8ea3');
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById('sentimentChart'), {
        type: 'bar',
        data: { labels, datasets: [{ data, backgroundColor: colors }] },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            y: { min: -1, max: 1, ticks: { color: '#8b94a7' }, grid: { color: '#232a3a' } },
            x: { ticks: { color: '#8b94a7' }, grid: { display: false } }
          }
        }
      });
    }

    let lastPrices = {};
    const coinLogos = {};

    function renderMarket(prices) {
      lastPrices = prices;
      const order = ['BTC','ETH','SOL','BNB','XRP','DOGE','ADA'];
      const el = document.getElementById('market');
      const keys = order.filter(k => prices[k]);
      if (!keys.length) { el.innerHTML = ''; return; }
      el.innerHTML = keys.map(k => {
        const p = prices[k], ch = p.change_24h ?? 0;
        const cls = ch >= 0 ? 'up' : 'down';
        const price = p.price != null ? '$' + Number(p.price).toLocaleString('en-US', {maximumFractionDigits: 6}) : '—';
        const logo = coinLogos[k] ? `<img src="${coinLogos[k]}" style="width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:5px">` : '';
        return `<div class="ticker">${logo}<span class="sym">${k}</span><span>${price}</span>
          <span class="${cls}">${ch >= 0 ? '+' : ''}${ch.toFixed(2)}%</span></div>`;
      }).join('');
    }

    function renderCorrelation(cc) {
      const el = document.getElementById('correlation');
      if (!cc) { el.innerHTML = '<span class="muted">нет данных</span>'; return; }
      const rows = [
        ['Объём BTC', cc.btc_volume], ['Funding rate', cc.funding_rate],
        ['DXY', cc.dxy], ['Nasdaq / BTC', cc.nasdaq],
      ];
      el.innerHTML = rows.map(([k,v]) =>
        `<div class="row"><span>${k}</span><span>${v ?? '—'}</span></div>`).join('');
    }

    function fmtUsd(n) {
      if (n == null) return '—';
      if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
      if (n >= 1e9)  return '$' + (n/1e9).toFixed(1) + 'B';
      if (n >= 1e6)  return '$' + (n/1e6).toFixed(1) + 'M';
      return '$' + Math.round(n);
    }

    function gaugeColor(v) { return v < 25 ? '#e74c3c' : v < 45 ? '#e67e22' : v < 55 ? '#7f8ea3' : v < 75 ? '#2ecc71' : '#1e9e57'; }

    function renderIndices(idx) {
      const el = document.getElementById('indices');
      const fg = idx.fear_greed, alt = idx.altseason;
      const card = (lbl, val, sub, color) => `<div class="idx">
        <div class="lbl">${lbl}</div>
        <div class="val" style="color:${color}">${val}</div>
        <div class="cls muted">${sub}</div>
        <div class="bar"><span style="width:${val}%;background:${color}"></span></div></div>`;
      let html = '';
      html += fg ? card('Fear & Greed', fg.value, fg.classification, gaugeColor(fg.value))
                 : card('Fear & Greed', '—', 'нет данных', '#7f8ea3');
      const phaseRu = { altseason:'Альтсезон', bitcoin:'Биткоин-сезон', neutral:'Нейтрально' };
      html += alt ? card('Altseason', alt.value, phaseRu[alt.phase] || alt.phase, gaugeColor(alt.value))
                  : card('Altseason', '—', 'нет данных', '#7f8ea3');
      el.innerHTML = html;
    }

    function renderGlobalMetrics(g) {
      const el = document.getElementById('globalMetrics');
      if (!g || !g.TOTAL) { el.innerHTML = '<span class="muted">нет данных</span>'; return; }
      const d = g.dominance || {};
      const rows = [
        ['TOTAL (весь рынок)', fmtUsd(g.TOTAL)],
        ['TOTAL2 (без BTC)', fmtUsd(g.TOTAL2)],
        ['OTHERS (вне топ-10)', fmtUsd(g.OTHERS)],
        ['BTC.D', d.BTC != null ? d.BTC + '%' : '—'],
        ['ETH.D', d.ETH != null ? d.ETH + '%' : '—'],
        ['OTHERS.D', d.OTHERS != null ? d.OTHERS + '%' : '—'],
      ];
      el.innerHTML = rows.map(([k,v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
    }

    function renderStatsbar(idx, g) {
      const fg = idx && idx.fear_greed;
      const alt = idx && idx.altseason;
      // иконка и цвет Fear & Greed
      const fgColor = !fg ? '' : gaugeColor(fg.value);
      document.getElementById('sb-fg').innerHTML = fg
        ? `<span style="color:${fgColor}">${fg.value} <span style="font-weight:400;font-size:11px">${fg.classification}</span></span>`
        : '<span style="color:var(--muted)">—</span>';
      // Альт-сезон
      const phaseRu = { altseason:'Альтсезон', bitcoin:'BTC-сезон', neutral:'Нейтрально' };
      document.getElementById('sb-alt').innerHTML = alt
        ? `<span style="color:${gaugeColor(alt.value)}">${alt.value} <span style="font-weight:400;font-size:11px">${phaseRu[alt.phase] || alt.phase}</span></span>`
        : '<span style="color:var(--muted)">—</span>';
      // Капитализация
      document.getElementById('sb-mcap').textContent = g && g.TOTAL ? fmtUsd(g.TOTAL) : '—';
    }

    async function loadIndices() {
      try {
        const [idx, g] = await Promise.all([
          fetch(`${API}/api/indices`).then(r => r.json()),
          fetch(`${API}/api/global`).then(r => r.json()),
        ]);
        renderIndices(idx); renderGlobalMetrics(g); renderStatsbar(idx, g);
      } catch {}
    }

    async function loadMarket() {
      try { renderMarket((await (await fetch(`${API}/api/market`)).json()).prices || {}); }
      catch {}
    }

    async function collect() {
      const btn = document.getElementById('collectBtn');
      const hours = document.getElementById('hours').value;
      btn.disabled = true; btn.textContent = 'Запуск…';
      try {
        await fetch(`${API}/api/collect/start?hours=${hours}`, { method: 'POST' });
      } catch { btn.disabled = false; btn.textContent = 'Собрать сейчас'; return; }
      pollCollect();
    }

    async function pollCollect() {
      const btn = document.getElementById('collectBtn');
      let s;
      try { s = await (await fetch(`${API}/api/collect/status`)).json(); }
      catch { setTimeout(pollCollect, 2000); return; }
      if (s.running) {
        const prog = s.phase === 'analyzing' && s.total ? ` ${s.done}/${s.total}` : '…';
        btn.textContent = `Собираю${prog}`;
        setTimeout(pollCollect, 1500);
        return;
      }
      btn.disabled = false; btn.textContent = 'Собрать сейчас';
      document.getElementById('collectStat').textContent = s.error
        ? `Ошибка: ${s.error}`
        : `Окно ${s.window_hours} ч · собрано ${s.collected} · ново разобрано ${s.analyzed}`;
      loadMarket(); loadIndices(); loadSentiment(); await loadFeed();
    }

    function renderFiltered() {
      const ev = document.getElementById('eventFilter').value;
      renderFeed(ev ? lastItems.filter(a => a.analysis.event_type === ev) : lastItems);
    }

    async function loadFeed() {
      const url = `${API}/api/feed${currentCoin ? `?coin=${currentCoin}` : ''}`;
      lastItems = await (await fetch(url)).json();
      renderFiltered();
      if (lastItems.length) renderCorrelation(lastItems[0].analysis.correlation_check);
    }

    async function loadSentiment() {
      try { renderChart(await (await fetch(`${API}/api/sentiment`)).json()); } catch {}
    }

    // --- Поиск по любой монете из топ-400 ---
    async function loadCoinList() {
      try {
        const u = await (await fetch(`${API}/api/universe?limit=400`)).json();
        const dl = document.getElementById('coinList');
        dl.innerHTML = (u.coins || []).map(c =>
          `<option value="${c.symbol}">${c.name}</option>`).join('');
      } catch {}
    }

    function clearSearch() {
      currentCoin = '';
      document.getElementById('coinSearch').value = '';
      document.getElementById('searchInfo').innerHTML = '';
      loadFeed();
    }

    // --- Watchlist (избранные монеты) в localStorage ---
    const WL_KEY = 'cn_watchlist';
    const getWatchlist = () => { try { return JSON.parse(localStorage.getItem(WL_KEY)) || []; } catch { return []; } };
    const saveWatchlist = (a) => localStorage.setItem(WL_KEY, JSON.stringify(a));
    const inWatchlist = (s) => getWatchlist().includes(s);
    function toggleWatch(sym) {
      let wl = getWatchlist();
      wl = wl.includes(sym) ? wl.filter(x => x !== sym) : [...wl, sym];
      saveWatchlist(wl); renderWatchlist();
    }
    function renderWatchlist() {
      const el = document.getElementById('watchlist');
      const wl = getWatchlist();
      if (!wl.length) { el.innerHTML = ''; return; }
      el.innerHTML = '<span class="wl-label">★ Избранное:</span>' + wl.map(s =>
        `<span class="wl-chip"><span class="wl-go" data-go="${s}">${s}</span><span class="x" data-x="${s}">✕</span></span>`).join('');
      el.querySelectorAll('.wl-go').forEach(n => n.onclick = () => {
        document.getElementById('coinSearch').value = n.dataset.go; doSearch();
      });
      el.querySelectorAll('.x').forEach(n => n.onclick = (e) => { e.stopPropagation(); toggleWatch(n.dataset.x); });
    }

    async function doSearch() {
      const q = document.getElementById('coinSearch').value.trim();
      const info = document.getElementById('searchInfo');
      if (!q) { clearSearch(); return; }
      // резолвим введённое (тикер или имя) в символ через поиск по вселенной;
      // если вселенная недоступна (rate-limit) — используем введённый текст как тикер
      let sym = q.toUpperCase();
      try {
        const r = await (await fetch(`${API}/api/coins/search?q=${encodeURIComponent(q)}&limit=1`)).json();
        if (r.results && r.results.length) sym = r.results[0].symbol;
      } catch {}
      currentCoin = sym;
      await loadFeed();
      // показываем котировку найденной монеты
      try {
        const c = await (await fetch(`${API}/api/coin?symbol=${sym}`)).json();
        const ch = c.change_24h;
        const cls = ch == null ? '' : ch >= 0 ? 'up' : 'down';
        const px = c.price != null ? '$' + Number(c.price).toLocaleString('en-US') : '—';
        const chTxt = ch == null ? '' : ` <span class="${cls}">${ch>=0?'+':''}${ch.toFixed(2)}%</span>`;
        const star = inWatchlist(c.symbol) ? '★' : '☆';
        info.innerHTML = `<span class="px">${c.symbol}</span><span>${px}</span>${chTxt}`
          + ` <span class="muted">(${lastItems.length} нов.)</span>`
          + ` <button class="star" id="starBtn" title="В избранное">${star}</button>`
          + ` <button class="clear" id="clearSearch">сброс ✕</button>`;
        document.getElementById('clearSearch').onclick = clearSearch;
        document.getElementById('starBtn').onclick = (e) => {
          toggleWatch(c.symbol); e.target.textContent = inWatchlist(c.symbol) ? '★' : '☆';
        };
      } catch {}
    }

    // --- Вкладка «Объём рынка»: таблица топ-100 ---
    let bubblesData = [], bubblesLoaded = false;
    let tableSort = { key: 'market_cap', dir: -1 };
    let cmChart = null, cmCoin = null, _globalCache = null;

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      const market = name === 'bubbles';
      document.getElementById('feedView').style.display = market ? 'none' : '';
      document.getElementById('bubblesView').style.display = market ? '' : 'none';
      document.getElementById('feedControls').style.display = market ? 'none' : '';
      if (market && !bubblesLoaded) { bubblesLoaded = true; loadMarketTable(); }
      else if (market) renderTable();
    }

    async function loadMarketTable() {
      try {
        const d = await (await fetch(`${API}/api/markets?limit=100`)).json();
        bubblesData = (d.coins || []).filter(c => c.market_cap);
        bubblesData.forEach(c => { if (c.image) coinLogos[c.symbol] = c.image; });
        if (Object.keys(lastPrices).length) renderMarket(lastPrices);
      } catch { bubblesData = []; }
      renderTable();
    }

    function renderTable() {
      const el = document.getElementById('marketTable');
      if (!bubblesData.length) {
        el.innerHTML = '<div class="empty">Нет данных (CoinGecko rate-limit) — попробуй позже.</div>';
        return;
      }
      const num = v => (v == null ? -Infinity : v);
      const data = [...bubblesData].sort((a, b) => {
        const k = tableSort.key;
        if (k === 'symbol') return tableSort.dir * String(a.symbol).localeCompare(String(b.symbol));
        return tableSort.dir * (num(a[k]) - num(b[k]));
      });
      const pct = v => v == null ? '<span class="muted">—</span>'
        : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
      const price = v => v == null ? '—' : '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 8 });
      const cols = [['rank','#'],['symbol','Монета'],['price','Цена'],['market_cap','Капитализация'],
        ['volume','Объём 24ч'],['change_1h','1ч'],['change_24h','24ч'],['change_7d','7д'],['change_30d','30д']];
      const arrow = k => tableSort.key === k ? (tableSort.dir < 0 ? ' ▼' : ' ▲') : '';
      const head = cols.map(([k,l]) => `<th data-k="${k}">${l}${arrow(k)}</th>`).join('');
      const rows = data.map(c => `<tr data-sym="${c.symbol}">
        <td>${c.rank ?? ''}</td>
        <td class="coin"><img src="${c.image || ''}" onerror="this.style.display='none'"/><b>${c.symbol}</b> <span class="muted name">${c.name || ''}</span></td>
        <td>${price(c.price)}</td>
        <td>${fmtUsd(c.market_cap)}</td>
        <td>${fmtUsd(c.volume)}</td>
        <td>${pct(c.change_1h)}</td><td>${pct(c.change_24h)}</td><td>${pct(c.change_7d)}</td><td>${pct(c.change_30d)}</td>
      </tr>`).join('');
      el.innerHTML = `<table class="mtable"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
      el.querySelectorAll('th').forEach(th => th.onclick = () => {
        const k = th.dataset.k;
        if (tableSort.key === k) tableSort.dir *= -1; else { tableSort.key = k; tableSort.dir = -1; }
        renderTable();
      });
      el.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => {
        const c = bubblesData.find(x => x.symbol === tr.dataset.sym);
        if (c) openCoinModal(c);
      });
    }


    // --- Модальное окно монеты ---
    async function getGlobal() {
      if (_globalCache) return _globalCache;
      try { _globalCache = await (await fetch(`${API}/api/global`)).json(); } catch {}
      return _globalCache;
    }

    async function openCoinModal(coin) {
      cmCoin = coin;
      document.getElementById('cmLogo').src = coin.image || '';
      document.getElementById('cmLogo').style.display = coin.image ? '' : 'none';
      document.getElementById('cmName').textContent = coin.name || coin.symbol;
      document.getElementById('cmSym').textContent = '$' + coin.symbol;
      document.getElementById('cmRank').textContent = coin.rank ? 'Рейтинг #' + coin.rank : '';
      document.getElementById('cmPrice').textContent = coin.price != null
        ? '$' + Number(coin.price).toLocaleString('en-US', { maximumFractionDigits: 8 }) : '—';
      const chip = (l, v) => `<div class="cm-chip"><span class="muted">${l}</span>`
        + `<b class="${v == null ? '' : v >= 0 ? 'up' : 'down'}">${v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%'}</b></div>`;
      document.getElementById('cmChips').innerHTML =
        chip('1ч', coin.change_1h) + chip('24ч', coin.change_24h) + chip('7д', coin.change_7d)
        + chip('30д', coin.change_30d) + chip('1г', coin.change_1y);
      let dom = '—';
      const g = await getGlobal();
      if (g && g.TOTAL && coin.market_cap) dom = (coin.market_cap / g.TOTAL * 100).toFixed(2) + '%';
      const row = (l, v) => `<div class="row"><span>${l}</span><span>${v}</span></div>`;
      document.getElementById('cmStats').innerHTML =
        row('Объём рынка (капитализация)', fmtUsd(coin.market_cap))
        + row('Объём за 24ч', fmtUsd(coin.volume))
        + row('Доминирование', dom)
        + row('Цена', coin.price != null ? '$' + Number(coin.price).toLocaleString('en-US', { maximumFractionDigits: 8 }) : '—');
      document.getElementById('cmLink').href = `https://www.coingecko.com/en/search?query=${encodeURIComponent(coin.symbol)}`;
      document.querySelectorAll('#cmChartTabs button').forEach(b => b.classList.toggle('active', b.dataset.d === '1'));
      document.getElementById('coinModal').style.display = 'flex';
      renderCoinChart(coin.symbol, 1);
    }

    async function renderCoinChart(symbol, days) {
      let prices = [];
      try { prices = (await (await fetch(`${API}/api/coin/chart?symbol=${symbol}&days=${days}`)).json()).prices || []; } catch {}
      const labels = prices.map(p => p[0]), data = prices.map(p => p[1]);
      const up = data.length > 1 ? data[data.length - 1] >= data[0] : true;
      const col = up ? '#2ecc71' : '#e74c3c';
      if (cmChart) { cmChart.destroy(); cmChart = null; }
      const cv = document.getElementById('cmChart');
      if (!data.length) {
        const ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#8b94a7'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('График временно недоступен (CoinGecko rate-limit)', cv.width / 2, cv.height / 2);
        return;
      }
      cmChart = new Chart(cv, {
        type: 'line',
        data: { labels, datasets: [{ data, borderColor: col, borderWidth: 1.5, fill: true, backgroundColor: col + '22', pointRadius: 0, tension: 0.25 }] },
        options: {
          animation: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: {
            title: i => new Date(i[0].label).toLocaleString('ru-RU'),
            label: c => '$' + Number(c.parsed.y).toLocaleString('en-US', { maximumFractionDigits: 8 }) } } },
          scales: { x: { display: false }, y: { position: 'right', ticks: { color: '#8b94a7', maxTicksLimit: 5 }, grid: { color: '#232a3a' } } }
        }
      });
    }

    function closeCoinModal() {
      document.getElementById('coinModal').style.display = 'none';
      if (cmChart) { cmChart.destroy(); cmChart = null; }
    }

    document.getElementById('coinModalClose').onclick = closeCoinModal;
    document.getElementById('coinModal').onclick = (e) => { if (e.target.id === 'coinModal') closeCoinModal(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCoinModal(); });
    document.querySelectorAll('#cmChartTabs button').forEach(b => b.onclick = () => {
      document.querySelectorAll('#cmChartTabs button').forEach(x => x.classList.toggle('active', x === b));
      if (cmCoin) renderCoinChart(cmCoin.symbol, +b.dataset.d);
    });
    document.getElementById('cmNews').onclick = () => {
      const sym = cmCoin && cmCoin.symbol; closeCoinModal();
      if (sym) { switchTab('feed'); document.getElementById('coinSearch').value = sym; doSearch(); }
    };

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
    document.getElementById('collectBtn').onclick = collect;
    document.getElementById('searchBtn').onclick = doSearch;
    document.getElementById('coinSearch').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    document.getElementById('eventFilter').onchange = renderFiltered;
    // Загружаем последовательно, чтобы не создавать пачку одновременных CoinGecko-запросов
    // (без ключа публичный rate-limit ~30 req/min, параллельность убивает кэш-логику)
    async function prefetchLogos() {
      try {
        const d = await (await fetch(`${API}/api/markets?limit=100`)).json();
        (d.coins || []).forEach(c => { if (c.image) coinLogos[c.symbol] = c.image; });
        if (Object.keys(lastPrices).length) renderMarket(lastPrices);
      } catch {}
    }

    loadHealth();
    renderWatchlist();
    loadFeed();
    loadMarket();
    setTimeout(loadIndices, 800);
    setTimeout(loadSentiment, 1200);
    setTimeout(loadCoinList, 2000);
    setTimeout(prefetchLogos, 3000);
  </script>
</body>
</html>

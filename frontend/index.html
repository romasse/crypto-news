<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto News Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg: #0b0e14; --panel: #141925; --border: #232a3a;
      --text: #e6e9f0; --muted: #8b94a7;
      --bull: #2ecc71; --bear: #e74c3c; --neutral: #7f8ea3; --accent: #f7a600;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg); color: var(--text); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; }
    .badge-ai { font-size: 12px; color: var(--muted); }
    .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button, input { background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: #1a1200; border: none; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    main { padding: 20px; display: grid; grid-template-columns: 1fr 360px; gap: 20px; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; }
    .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; }
    .news { display: flex; flex-direction: column; gap: 12px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px;
      flex-wrap: wrap; margin-bottom: 6px; }
    .card .title { font-weight: 600; margin-bottom: 6px; }
    .card .title a { color: var(--text); text-decoration: none; }
    .card .summary { font-size: 14px; color: #c7cdda; margin-bottom: 10px; }
    .biases { display: flex; gap: 8px; flex-wrap: wrap; }
    .bias { font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .Bullish { background: rgba(46,204,113,.15); color: var(--bull); }
    .Bearish { background: rgba(231,76,60,.15); color: var(--bear); }
    .Neutral { background: rgba(127,142,163,.15); color: var(--neutral); }
    .chip { font-size: 11px; padding: 2px 7px; border-radius: 5px;
      background: rgba(247,166,0,.12); color: var(--accent); }
    .ev { font-size: 11px; padding: 2px 7px; border-radius: 5px; text-transform: uppercase;
      letter-spacing: .03em; background: rgba(91,124,250,.15); color: #8aa0ff; }
    .indices { display: flex; gap: 10px; }
    .idx { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .idx .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .idx .val { font-size: 22px; font-weight: 700; margin: 2px 0; }
    .idx .cls { font-size: 12px; }
    .idx .bar { height: 5px; border-radius: 3px; background: var(--border); margin-top: 6px; overflow: hidden; }
    .idx .bar > span { display: block; height: 100%; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    .stat { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .muted { color: var(--muted); }
    #coinSearch { min-width: 180px; }
    .search-info { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .search-info .px { color: var(--text); font-weight: 600; }
    .search-info .up { color: var(--bull); } .search-info .down { color: var(--bear); }
    .search-info .clear { cursor: pointer; color: var(--accent); border: none; background: none; font-size: 13px; }
    .search-info .star { cursor: pointer; border: none; background: none; font-size: 14px; color: var(--accent); }
    .watchlist { display: flex; gap: 8px; align-items: center; padding: 8px 20px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); }
    .watchlist:empty { display: none; }
    .watchlist .wl-label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .wl-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
    .wl-chip:hover { border-color: var(--accent); }
    .wl-chip .x { color: var(--muted); font-size: 12px; }
    .wl-chip .x:hover { color: var(--bear); }
    .tabs { display: flex; gap: 4px; }
    .tab { background: transparent; border: 1px solid transparent; color: var(--muted);
      border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
    .tab.active { color: var(--text); background: var(--panel); border-color: var(--border); }
    #bubblesView { padding: 8px 12px 0; }
    #bubbles { width: 100%; height: calc(100vh - 150px); display: block; }
    #bubbles text { pointer-events: none; user-select: none; }
    .bubble-tip { position: fixed; z-index: 50; pointer-events: none; max-width: 260px;
      background: #0b0e14; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 13px; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .bubble-tip b { font-size: 14px; }
    .bubble-tip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); margin-top: 2px; }
    .bubble-tip .row span:last-child { color: var(--text); }
    .bubble-tip .up { color: var(--bull); } .bubble-tip .down { color: var(--bear); }
    .market { display: flex; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border);
      overflow-x: auto; }
    .ticker { display: flex; gap: 8px; align-items: baseline; font-size: 13px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; white-space: nowrap; }
    .ticker .sym { font-weight: 700; }
    .ticker .up { color: var(--bull); } .ticker .down { color: var(--bear); }
    .cc { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .cc .row { display: flex; justify-content: space-between; }
    .cc .row span:first-child { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>🪙 Crypto News Analyzer</h1>
    <span class="badge-ai" id="aiBadge">…</span>
    <nav class="tabs">
      <button class="tab active" data-tab="feed">Лента</button>
      <button class="tab" data-tab="bubbles">Объём рынка</button>
    </nav>
    <div class="controls" id="bubbleControls" style="display:none">
      <select id="bubbleMetric">
        <option value="market_cap">Размер: Капитализация</option>
        <option value="volume">Размер: Объём 24ч</option>
        <option value="price">Размер: Цена</option>
      </select>
      <select id="bubblePeriod">
        <option value="change_1h">Изменение: 1ч</option>
        <option value="change_24h" selected>Изменение: 24ч</option>
        <option value="change_7d">Изменение: 7д</option>
        <option value="change_30d">Изменение: 30д</option>
      </select>
    </div>
    <div class="controls" id="feedControls">
      <input id="coinSearch" list="coinList" placeholder="Монета: BTC, Solana…" autocomplete="off" />
      <datalist id="coinList"></datalist>
      <button id="searchBtn">Поиск</button>
      <span id="searchInfo" class="search-info"></span>
      <select id="eventFilter">
        <option value="">Все события</option>
        <option value="upgrade">Апгрейды</option>
        <option value="collaboration">Коллаборации</option>
        <option value="announcement">Анонсы</option>
        <option value="listing">Листинги</option>
        <option value="regulation">Регуляторика</option>
        <option value="market">Рынок</option>
      </select>
      <select id="hours">
        <option value="1">1 час</option>
        <option value="2" selected>2 часа</option>
        <option value="6">6 часов</option>
        <option value="24">24 часа</option>
      </select>
      <button class="primary" id="collectBtn">Собрать сейчас</button>
    </div>
  </header>

  <div id="feedView">
  <div class="market" id="market"></div>
  <div class="watchlist" id="watchlist"></div>

  <main>
    <section class="panel">
      <h2>Лента событий</h2>
      <div class="news" id="news"><div class="empty">Нажми «Собрать сейчас», чтобы запустить конвейер.</div></div>
    </section>
    <aside class="panel">
      <h2>Индексы рынка</h2>
      <div class="indices" id="indices"><span class="muted">загрузка…</span></div>
      <h2 style="margin-top:18px">Капитализация и доминирование</h2>
      <div class="cc" id="globalMetrics"><span class="muted">загрузка…</span></div>
      <h2 style="margin-top:18px">Сентимент по монетам</h2>
      <canvas id="sentimentChart" height="220"></canvas>
      <div class="stat" id="collectStat"></div>
      <h2 style="margin-top:18px">Correlation Check</h2>
      <div class="cc" id="correlation"><span class="muted">собери данные →</span></div>
    </aside>
  </main>
  </div>

  <section id="bubblesView" style="display:none">
    <svg id="bubbles"></svg>
    <div id="bubbleTip" class="bubble-tip" style="display:none"></div>
  </section>

  <script>
    const API = location.origin;
    let chart;
    let lastItems = [];
    let currentCoin = '';   // активный фильтр по монете (символ) — задаётся поиском
    const EV_LABEL = { upgrade:'Апгрейд', collaboration:'Коллаб', announcement:'Анонс',
      listing:'Листинг', regulation:'Регуляторика', market:'Рынок', other:'Прочее' };

    async function loadHealth() {
      try {
        const h = await (await fetch(`${API}/api/health`)).json();
        document.getElementById('aiBadge').textContent =
          h.ai_enabled ? 'Роман Субота' : 'Роман Субота (демо-режим)';
      } catch { document.getElementById('aiBadge').textContent = 'API offline'; }
    }

    function biasHtml(db) {
      return ['BTC','ETH','SOL'].map(c =>
        `<span class="bias ${db[c]}">${c}: ${db[c]}</span>`).join('');
    }

    function renderFeed(items) {
      const el = document.getElementById('news');
      if (!items.length) {
        const msg = currentCoin
          ? `Нет новостей по ${currentCoin} в собранных данных.<br>Нажми «Собрать сейчас» или выбери период побольше — котировка монеты показана выше.`
          : 'Нет событий. Нажми «Собрать сейчас», чтобы запустить конвейер.';
        el.innerHTML = `<div class="empty">${msg}</div>`;
        return;
      }
      el.innerHTML = items.map(a => {
        const it = a.item, an = a.analysis;
        const time = new Date(it.published_at).toLocaleString('ru-RU');
        const coins = it.coins.map(c => `<span class="chip">${c}</span>`).join(' ');
        const title = it.url ? `<a href="${it.url}" target="_blank">${it.title}</a>` : it.title;
        const ev = `<span class="ev">${EV_LABEL[an.event_type] || an.event_type || 'other'}</span>`;
        return `<div class="card">
          <div class="meta"><span>${it.source}</span><span>${time}</span>${ev}
            <span>сентимент: ${an.sentiment >= 0 ? '+' : ''}${an.sentiment}</span>${coins}</div>
          <div class="title">${title}</div>
          <div class="summary">${an.ai_analysis || an.summary}</div>
          <div class="biases">${biasHtml(an.directional_bias)}</div>
        </div>`;
      }).join('');
    }

    function renderChart(map) {
      const labels = Object.keys(map), data = Object.values(map);
      const colors = data.map(v => v > 0.1 ? '#2ecc71' : v < -0.1 ? '#e74c3c' : '#7f8ea3');
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById('sentimentChart'), {
        type: 'bar',
        data: { labels, datasets: [{ data, backgroundColor: colors }] },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            y: { min: -1, max: 1, ticks: { color: '#8b94a7' }, grid: { color: '#232a3a' } },
            x: { ticks: { color: '#8b94a7' }, grid: { display: false } }
          }
        }
      });
    }

    function renderMarket(prices) {
      const order = ['BTC','ETH','SOL','BNB','XRP','DOGE','ADA'];
      const el = document.getElementById('market');
      const keys = order.filter(k => prices[k]);
      if (!keys.length) { el.innerHTML = ''; return; }
      el.innerHTML = keys.map(k => {
        const p = prices[k], ch = p.change_24h ?? 0;
        const cls = ch >= 0 ? 'up' : 'down';
        const price = p.price != null ? '$' + Number(p.price).toLocaleString('en-US') : '—';
        return `<div class="ticker"><span class="sym">${k}</span><span>${price}</span>
          <span class="${cls}">${ch >= 0 ? '+' : ''}${ch.toFixed(2)}%</span></div>`;
      }).join('');
    }

    function renderCorrelation(cc) {
      const el = document.getElementById('correlation');
      if (!cc) { el.innerHTML = '<span class="muted">нет данных</span>'; return; }
      const rows = [
        ['Объём BTC', cc.btc_volume], ['Funding rate', cc.funding_rate],
        ['DXY', cc.dxy], ['Nasdaq / BTC', cc.nasdaq],
      ];
      el.innerHTML = rows.map(([k,v]) =>
        `<div class="row"><span>${k}</span><span>${v ?? '—'}</span></div>`).join('');
    }

    function fmtUsd(n) {
      if (n == null) return '—';
      if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
      if (n >= 1e9)  return '$' + (n/1e9).toFixed(1) + 'B';
      if (n >= 1e6)  return '$' + (n/1e6).toFixed(1) + 'M';
      return '$' + Math.round(n);
    }

    function gaugeColor(v) { return v < 25 ? '#e74c3c' : v < 45 ? '#e67e22' : v < 55 ? '#7f8ea3' : v < 75 ? '#2ecc71' : '#1e9e57'; }

    function renderIndices(idx) {
      const el = document.getElementById('indices');
      const fg = idx.fear_greed, alt = idx.altseason;
      const card = (lbl, val, sub, color) => `<div class="idx">
        <div class="lbl">${lbl}</div>
        <div class="val" style="color:${color}">${val}</div>
        <div class="cls muted">${sub}</div>
        <div class="bar"><span style="width:${val}%;background:${color}"></span></div></div>`;
      let html = '';
      html += fg ? card('Fear & Greed', fg.value, fg.classification, gaugeColor(fg.value))
                 : card('Fear & Greed', '—', 'нет данных', '#7f8ea3');
      const phaseRu = { altseason:'Альтсезон', bitcoin:'Биткоин-сезон', neutral:'Нейтрально' };
      html += alt ? card('Altseason', alt.value, phaseRu[alt.phase] || alt.phase, gaugeColor(alt.value))
                  : card('Altseason', '—', 'нет данных', '#7f8ea3');
      el.innerHTML = html;
    }

    function renderGlobalMetrics(g) {
      const el = document.getElementById('globalMetrics');
      if (!g || !g.TOTAL) { el.innerHTML = '<span class="muted">нет данных</span>'; return; }
      const d = g.dominance || {};
      const rows = [
        ['TOTAL (весь рынок)', fmtUsd(g.TOTAL)],
        ['TOTAL2 (без BTC)', fmtUsd(g.TOTAL2)],
        ['OTHERS (вне топ-10)', fmtUsd(g.OTHERS)],
        ['BTC.D', d.BTC != null ? d.BTC + '%' : '—'],
        ['ETH.D', d.ETH != null ? d.ETH + '%' : '—'],
        ['OTHERS.D', d.OTHERS != null ? d.OTHERS + '%' : '—'],
      ];
      el.innerHTML = rows.map(([k,v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
    }

    async function loadIndices() {
      try {
        const [idx, g] = await Promise.all([
          fetch(`${API}/api/indices`).then(r => r.json()),
          fetch(`${API}/api/global`).then(r => r.json()),
        ]);
        renderIndices(idx); renderGlobalMetrics(g);
      } catch {}
    }

    async function loadMarket() {
      try { renderMarket((await (await fetch(`${API}/api/market`)).json()).prices || {}); }
      catch {}
    }

    async function collect() {
      const btn = document.getElementById('collectBtn');
      const hours = document.getElementById('hours').value;
      btn.disabled = true; btn.textContent = 'Запуск…';
      try {
        await fetch(`${API}/api/collect/start?hours=${hours}`, { method: 'POST' });
      } catch { btn.disabled = false; btn.textContent = 'Собрать сейчас'; return; }
      pollCollect();
    }

    async function pollCollect() {
      const btn = document.getElementById('collectBtn');
      let s;
      try { s = await (await fetch(`${API}/api/collect/status`)).json(); }
      catch { setTimeout(pollCollect, 2000); return; }
      if (s.running) {
        const prog = s.phase === 'analyzing' && s.total ? ` ${s.done}/${s.total}` : '…';
        btn.textContent = `Собираю${prog}`;
        setTimeout(pollCollect, 1500);
        return;
      }
      btn.disabled = false; btn.textContent = 'Собрать сейчас';
      document.getElementById('collectStat').textContent = s.error
        ? `Ошибка: ${s.error}`
        : `Окно ${s.window_hours} ч · собрано ${s.collected} · ново разобрано ${s.analyzed}`;
      loadMarket(); loadIndices(); loadSentiment(); await loadFeed();
    }

    function renderFiltered() {
      const ev = document.getElementById('eventFilter').value;
      renderFeed(ev ? lastItems.filter(a => a.analysis.event_type === ev) : lastItems);
    }

    async function loadFeed() {
      const url = `${API}/api/feed${currentCoin ? `?coin=${currentCoin}` : ''}`;
      lastItems = await (await fetch(url)).json();
      renderFiltered();
      if (lastItems.length) renderCorrelation(lastItems[0].analysis.correlation_check);
    }

    async function loadSentiment() {
      try { renderChart(await (await fetch(`${API}/api/sentiment`)).json()); } catch {}
    }

    // --- Поиск по любой монете из топ-400 ---
    async function loadCoinList() {
      try {
        const u = await (await fetch(`${API}/api/universe?limit=400`)).json();
        const dl = document.getElementById('coinList');
        dl.innerHTML = (u.coins || []).map(c =>
          `<option value="${c.symbol}">${c.name}</option>`).join('');
      } catch {}
    }

    function clearSearch() {
      currentCoin = '';
      document.getElementById('coinSearch').value = '';
      document.getElementById('searchInfo').innerHTML = '';
      loadFeed();
    }

    // --- Watchlist (избранные монеты) в localStorage ---
    const WL_KEY = 'cn_watchlist';
    const getWatchlist = () => { try { return JSON.parse(localStorage.getItem(WL_KEY)) || []; } catch { return []; } };
    const saveWatchlist = (a) => localStorage.setItem(WL_KEY, JSON.stringify(a));
    const inWatchlist = (s) => getWatchlist().includes(s);
    function toggleWatch(sym) {
      let wl = getWatchlist();
      wl = wl.includes(sym) ? wl.filter(x => x !== sym) : [...wl, sym];
      saveWatchlist(wl); renderWatchlist();
    }
    function renderWatchlist() {
      const el = document.getElementById('watchlist');
      const wl = getWatchlist();
      if (!wl.length) { el.innerHTML = ''; return; }
      el.innerHTML = '<span class="wl-label">★ Избранное:</span>' + wl.map(s =>
        `<span class="wl-chip"><span class="wl-go" data-go="${s}">${s}</span><span class="x" data-x="${s}">✕</span></span>`).join('');
      el.querySelectorAll('.wl-go').forEach(n => n.onclick = () => {
        document.getElementById('coinSearch').value = n.dataset.go; doSearch();
      });
      el.querySelectorAll('.x').forEach(n => n.onclick = (e) => { e.stopPropagation(); toggleWatch(n.dataset.x); });
    }

    async function doSearch() {
      const q = document.getElementById('coinSearch').value.trim();
      const info = document.getElementById('searchInfo');
      if (!q) { clearSearch(); return; }
      // резолвим введённое (тикер или имя) в символ через поиск по вселенной;
      // если вселенная недоступна (rate-limit) — используем введённый текст как тикер
      let sym = q.toUpperCase();
      try {
        const r = await (await fetch(`${API}/api/coins/search?q=${encodeURIComponent(q)}&limit=1`)).json();
        if (r.results && r.results.length) sym = r.results[0].symbol;
      } catch {}
      currentCoin = sym;
      await loadFeed();
      // показываем котировку найденной монеты
      try {
        const c = await (await fetch(`${API}/api/coin?symbol=${sym}`)).json();
        const ch = c.change_24h;
        const cls = ch == null ? '' : ch >= 0 ? 'up' : 'down';
        const px = c.price != null ? '$' + Number(c.price).toLocaleString('en-US') : '—';
        const chTxt = ch == null ? '' : ` <span class="${cls}">${ch>=0?'+':''}${ch.toFixed(2)}%</span>`;
        const star = inWatchlist(c.symbol) ? '★' : '☆';
        info.innerHTML = `<span class="px">${c.symbol}</span><span>${px}</span>${chTxt}`
          + ` <span class="muted">(${lastItems.length} нов.)</span>`
          + ` <button class="star" id="starBtn" title="В избранное">${star}</button>`
          + ` <button class="clear" id="clearSearch">сброс ✕</button>`;
        document.getElementById('clearSearch').onclick = clearSearch;
        document.getElementById('starBtn').onclick = (e) => {
          toggleWatch(c.symbol); e.target.textContent = inWatchlist(c.symbol) ? '★' : '☆';
        };
      } catch {}
    }

    // --- Вкладки: Лента / Объём рынка (пузыри) ---
    let bubblesData = [], bubbleSim = null, bubblesLoaded = false;

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      const bubbles = name === 'bubbles';
      document.getElementById('feedView').style.display = bubbles ? 'none' : '';
      document.getElementById('bubblesView').style.display = bubbles ? '' : 'none';
      document.getElementById('feedControls').style.display = bubbles ? 'none' : '';
      document.getElementById('bubbleControls').style.display = bubbles ? '' : 'none';
      if (bubbles && !bubblesLoaded) { bubblesLoaded = true; loadBubbles(); }
      else if (bubbles) drawBubbles();
      else if (bubbleSim) bubbleSim.stop();  // скрыта — не жжём CPU
    }

    async function loadBubbles() {
      try {
        const d = await (await fetch(`${API}/api/markets?limit=100`)).json();
        bubblesData = (d.coins || []).filter(c => c.market_cap);
      } catch { bubblesData = []; }
      drawBubbles();
    }

    function drawBubbles() {
      const svg = d3.select('#bubbles');
      const W = svg.node().clientWidth, H = svg.node().clientHeight;
      svg.selectAll('*').remove();
      if (!bubblesData.length) {
        svg.append('text').attr('x', W/2).attr('y', H/2).attr('text-anchor','middle')
          .attr('fill','#8b94a7').text('Нет данных (CoinGecko rate-limit) — попробуй позже');
        return;
      }
      const metric = document.getElementById('bubbleMetric').value;
      const period = document.getElementById('bubblePeriod').value;  // change_1h/24h/7d/30d
      const val = c => metric === 'price' ? (c.price || 0)
                     : metric === 'volume' ? (c.volume || 0) : (c.market_cap || 0);
      const chg = c => c[period];
      const maxV = d3.max(bubblesData, val) || 1;
      const rScale = d3.scaleSqrt().domain([0, maxV]).range([8, Math.min(W, H) / 6]);
      const color = c => { const v = chg(c); return v > 0 ? '#2ecc71' : v < 0 ? '#e74c3c' : '#7f8ea3'; };
      const nodes = bubblesData.map(c => ({ ...c, r: rScale(val(c)), x: W/2 + (Math.random()-0.5)*W, y: H/2 + (Math.random()-0.5)*H }));

      const node = svg.selectAll('g').data(nodes).join('g').style('cursor','pointer')
        .on('click', (e, d) => { switchTab('feed'); document.getElementById('coinSearch').value = d.symbol; doSearch(); });
      node.append('circle').attr('r', d => d.r)
        .attr('fill', d => color(d)).attr('fill-opacity', 0.22)
        .attr('stroke', d => color(d)).attr('stroke-width', 1.5);
      node.append('text').text(d => d.symbol).attr('text-anchor','middle').attr('dy','-0.05em')
        .attr('fill','#e6e9f0').attr('font-weight',600)
        .attr('font-size', d => Math.max(8, Math.min(d.r/2.2, 18)))
        .attr('opacity', d => d.r > 12 ? 1 : 0);
      node.append('text').text(d => { const v = chg(d); return v == null ? '—' : (v>=0?'+':'') + v.toFixed(1) + '%'; })
        .attr('text-anchor','middle').attr('dy','1.15em').attr('fill', d => color(d))
        .attr('font-size', d => Math.max(8, Math.min(d.r/3.2, 13)))
        .attr('opacity', d => d.r > 18 ? 1 : 0);

      // карточка по наведению: цена, капа, объём, все периоды
      const tip = document.getElementById('bubbleTip');
      const pct = v => v == null ? '<span>—</span>'
        : `<span class="${v>=0?'up':'down'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;
      node.on('mouseenter', (e, d) => {
        const price = d.price != null ? '$' + Number(d.price).toLocaleString('en-US', {maximumFractionDigits: 8}) : '—';
        tip.innerHTML = `<b>${d.name}</b> <span class="muted">${d.symbol} · #${d.rank}</span>`
          + `<div class="row"><span>Цена</span><span>${price}</span></div>`
          + `<div class="row"><span>Капитализация</span><span>${fmtUsd(d.market_cap)}</span></div>`
          + `<div class="row"><span>Объём 24ч</span><span>${fmtUsd(d.volume)}</span></div>`
          + `<div class="row"><span>1ч / 24ч</span><span>${pct(d.change_1h)} / ${pct(d.change_24h)}</span></div>`
          + `<div class="row"><span>7д / 30д</span><span>${pct(d.change_7d)} / ${pct(d.change_30d)}</span></div>`;
        tip.style.display = 'block';
      });
      node.on('mousemove', (e) => {
        tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 270) + 'px';
        tip.style.top = Math.min(e.clientY + 14, window.innerHeight - 130) + 'px';
      });
      node.on('mouseleave', () => { tip.style.display = 'none'; });

      // стартовые скорости для живого движения
      nodes.forEach(d => { d.vx = (Math.random()-0.5)*1.2; d.vy = (Math.random()-0.5)*1.2; });

      // случайный «дрейф» — постоянно подкидывает энергию, чтобы пузыри не замирали
      const drift = () => nodes.forEach(d => { d.vx += (Math.random()-0.5)*0.25; d.vy += (Math.random()-0.5)*0.25; });

      if (bubbleSim) bubbleSim.stop();
      bubbleSim = d3.forceSimulation(nodes)
        .alphaDecay(0).alphaMin(0).velocityDecay(0.12)  // не затухать → плавают вечно
        .force('x', d3.forceX(W/2).strength(0.0015))     // лёгкое притяжение к центру
        .force('y', d3.forceY(H/2).strength(0.0015))
        .force('collide', d3.forceCollide().radius(d => d.r + 2).strength(0.85))
        .force('drift', drift)
        .on('tick', () => node.attr('transform', d => {
          // ограничиваем скорость и отскакиваем от стенок (сохраняя импульс)
          d.vx = Math.max(-2.2, Math.min(2.2, d.vx));
          d.vy = Math.max(-2.2, Math.min(2.2, d.vy));
          if (d.x < d.r) { d.x = d.r; d.vx = Math.abs(d.vx); }
          else if (d.x > W - d.r) { d.x = W - d.r; d.vx = -Math.abs(d.vx); }
          if (d.y < d.r) { d.y = d.r; d.vy = Math.abs(d.vy); }
          else if (d.y > H - d.r) { d.y = H - d.r; d.vy = -Math.abs(d.vy); }
          return `translate(${d.x},${d.y})`;
        }));
    }

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
    document.getElementById('bubbleMetric').onchange = drawBubbles;
    document.getElementById('bubblePeriod').onchange = drawBubbles;
    // переразложить пузыри при изменении размера окна (иначе обрезаются)
    let _resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(_resizeT);
      _resizeT = setTimeout(() => {
        if (document.getElementById('bubblesView').style.display !== 'none' && bubblesLoaded) drawBubbles();
      }, 200);
    });
    document.getElementById('collectBtn').onclick = collect;
    document.getElementById('searchBtn').onclick = doSearch;
    document.getElementById('coinSearch').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    document.getElementById('eventFilter').onchange = renderFiltered;
    loadHealth(); loadFeed(); loadMarket(); loadIndices(); loadSentiment(); loadCoinList(); renderWatchlist();
  </script>
</body>
</html>
